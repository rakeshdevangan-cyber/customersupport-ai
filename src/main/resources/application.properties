spring.application.name=customer
server.port=8080

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

spring.datasource.url=jdbc:postgresql://localhost:5432/customer_ai
spring.datasource.username=customer_ai
spring.datasource.password=${DB_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/customer-ai
spring.security.oauth2.resourceserver.jwt.audiences=customer-support-api

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

# MCP Server configuration
spring.ai.mcp.server.name=customer-support-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.type=SYNC
